<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#101915" />
  <link rel="stylesheet" href="/styles.css?v=5.2.1" />
  <title>OUTPOST ZERO V5.2</title>
</head>
<body class="game-page">
  <div id="rotateHint" class="rotate-hint">기기를 가로로 돌려주세요.</div>
  <div class="game-shell">
    <canvas id="gameCanvas" width="960" height="540"></canvas>
    <div class="game-version-chip">V5.2.1</div>

    <div class="top-buttons"><button id="soundBtn" class="icon-btn">🔊</button><button id="pauseBtn" class="icon-btn">Ⅱ</button></div>
    <div class="hud top-center panel timer-hud"><b id="timerText">10:00</b><span id="missionText">STAGE 01</span></div>

    <div class="minimap-wrap panel">
      <div class="minimap-title"><b id="stageMiniTitle">STAGE 01</b><span id="mapSizeLabel">MAP</span></div>
      <canvas id="minimapCanvas" width="220" height="132"></canvas>
    </div>

    <div class="right-stack">
      <button id="menuBtn" class="battle-menu-btn panel"><b>전투 상점</b><span>U · 두 번 터치</span></button>
      <div class="hud-panel panel">
        <div class="hp-row"><span>HP</span><div class="bar"><i id="hpBar"></i></div><b id="hpText">100/100</b></div>
        <div class="resource-line"><span>카르마</span><b id="karmaText">0</b></div>
        <div class="resource-line"><span>골드</span><b id="creditText">0</b></div>
        <div class="stat-strip"><span>공격 <b id="attackText">15</b></span><span>방어 <b id="defenseText">0</b></span><span>속도 <b id="speedText">190</b></span></div>
      </div>
    </div>

    <button id="exchangeBtn" class="exchange-btn hidden"><b>E</b><span>카르마 교환</span></button>
    <div id="eventBanner" class="event-banner"></div>
    <div id="terrainHint" class="terrain-hint hidden"></div>

    <div class="mobile-controls">
      <div id="joyBase" class="joystick"><div id="joyKnob"></div></div>
      <div class="skill-stack">
        <button id="healBtn" class="skill-btn heal-btn"><b>회복</b><small id="healCd">Q · 80C</small></button>
        <button id="stimBtn" class="skill-btn stim-btn"><b>STIM</b><small id="stimCd">R · LOCK</small></button>
      </div>
    </div>

    <div id="battleMenu" class="overlay hidden">
      <section class="choice-modal panel">
        <div class="menu-head"><div><small>FIELD TERMINAL</small><h2>전투 상점</h2></div><div class="wallet">보유 골드 <b><i id="menuCredit">0</i>C</b></div></div>
        <p class="menu-note">시즌 1에서는 캐릭터만 성장합니다. 공격·방어·속도는 스테이지를 클리어하면 다음 스테이지에도 이어집니다.</p>
        <div id="shopList" class="shop-grid"></div>
        <button id="closeMenuBtn" class="btn primary wide">전투로 복귀</button>
      </section>
    </div>

    <div id="pauseOverlay" class="overlay hidden">
      <section class="choice-modal panel pause-modal"><small>PAUSED</small><h2>작전 메뉴</h2><div id="pauseSnapshot" class="pause-snapshot"></div>
        <button id="resumeBtn" class="btn primary wide">계속하기</button><button id="saveHomeBtn" class="btn wide">저장하고 메인으로</button><button id="abandonBtn" class="btn danger wide">시즌 진행 포기</button>
      </section>
    </div>

    <div id="endScreen" class="overlay hidden"><section class="choice-modal panel"><small>SORTIE RESULT</small><h2 id="endTitle">작전 종료</h2><p id="endReason"></p><div id="endRewards" class="end-rewards"></div><a href="/" class="btn primary wide">메인으로</a></section></div>

    <div id="debugPanel" class="debug-panel hidden"><button id="debugCreditsBtn">+1000C</button><button id="debugRevealBtn">FOG 공개</button></div>
  </div>
  <script type="module" src="/js/game.js?v=5.2.1"></script>
</body>
</html>
