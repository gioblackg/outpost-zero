<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#14231b" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/styles.css?v=5.0.0" />
  <title>OUTPOST ZERO V5.0</title>
</head>
<body class="hub-page">
  <main class="hub-shell">
    <header class="title-block">
      <div class="title-meta"><span>OUTPOST ZERO · SEASON 1</span><b class="version-badge">V5.0.0</b></div>
      <h1>OUTPOST ZERO</h1>
      <p>적 거점을 파괴하고 카르마를 회수해 분대를 성장시키세요.</p>
    </header>

    <section class="main-card panel">
      <div id="profileLine" class="profile-line"></div>
      <div id="resumeCard" class="resume-card hidden">
        <div><small>진행 중인 작전</small><strong id="resumeSummary"></strong></div>
        <a class="btn primary" href="/game.html?resume=1">계속하기</a>
      </div>

      <div class="section-title"><div><small>SEASON 1</small><h2>스테이지 선택</h2></div><b id="stageProgress">0 / 20</b></div>
      <div id="stageGrid" class="stage-grid"></div>
      <div class="future-stage">STAGE 6–20 · 이후 업데이트에서 순차 개방</div>
      <div class="home-actions"><button id="growthBtn" class="btn">성장 현황</button><button id="settingsBtn" class="btn">설정</button></div>
    </section>
  </main>

  <dialog id="growthDialog" class="dialog panel">
    <div class="dialog-head"><div><small>CHARACTER GROWTH</small><h2>성장 현황</h2></div><button id="closeGrowthBtn" class="btn small">닫기</button></div>
    <div id="growthStats" class="growth-grid"></div>
  </dialog>

  <dialog id="settingsDialog" class="dialog panel">
    <div class="dialog-head"><div><small>SETTINGS</small><h2>설정</h2></div><button id="closeSettingsBtn" class="btn small">닫기</button></div>
    <div class="setting-row"><div><b>스팀팩 단축키</b><small>기본값 R</small></div><button id="stimKeyBtn" class="btn">R</button></div><p id="keyHint" class="setting-hint hidden">원하는 키를 누르세요. ESC는 취소.</p><div class="setting-row"><div><b>효과음</b><small>전투 효과음 켜기/끄기</small></div><button id="soundSettingBtn" class="btn">켜짐</button></div>
  </dialog>

  <script type="module" src="/js/base.js?v=5.0.0"></script>
</body>
</html>
